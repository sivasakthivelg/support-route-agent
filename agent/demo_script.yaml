title: "SupportRoute"
pitch: "AI-powered customer support routing with Strands Decider"
features:
  - "Routes customer messages to the right team automatically"
  - "Detects urgency and escalates critical cases immediately"
  - "Low-confidence fallback asks for clarification instead of misrouting"
  - "Every request gets a unique ticket reference and response-time estimate"

intro: >
  SupportRoute reads a customer message and uses Strands Decider to classify it
  into the right support category, then creates a ticket and tells the customer
  which team will handle their request.

turns:
  - say: "I was charged twice for my subscription this month."
    narrate: >
      A billing message. Watch how the decider classifies the category
      and the agent creates a ticket for the Billing team.

  - say: "The app crashes every time I try to open the dashboard. It has been like this for two days."
    narrate: >
      A technical issue. The decider picks technical support and the agent
      routes to the Technical Support team.

  - say: "This is absolutely unacceptable! I have been waiting for three days and no one has helped me. I want to speak to a manager immediately!"
    narrate: >
      An escalation. The decider detects both the escalation category and the
      urgent flag. The agent creates a critical-priority ticket for Senior Support.

  - say: "I am not really sure what is going on, something just feels off with my account or maybe the billing?"
    narrate: >
      A low-confidence case. The decider is uncertain, so the agent asks
      the customer to clarify rather than misrouting.

outro: >
  SupportRoute routes every customer message to the right team quickly,
  with calibrated confidence so it knows when to ask rather than guess.
